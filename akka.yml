name: "akka-utils"
version: "1.0.0"
description: "Kumpulan perintah utilitas (.random, .pick, .convert) untuk Akka WhatsApp Bot."
commands:
  - name: "Random"
    usage: ".random [min] [max]"
    module: "./src/random.ts"
    description: "Menghasilkan angka acak bulat antara min dan max (default 1-100)."
  - name: "Pick"
    usage: ".pick [item1] [item2] ..."
    module: "./src/pick.ts"
    description: "Memilih item secara acak dari daftar pilihan."
  - name: "Convert"
    usage: ".convert [nilai] [dari] [ke]"
    module: "./src/convert.ts"
    description: "Mengonversi satuan Panjang, Massa, dan Suhu."
